[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "documenttoolkit"
version = "0.1.0"
description = "Herramienta para escaneo, OCR, clasificación y extracción de datos de documentos"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
